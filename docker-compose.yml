services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: quantagent-api:local
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL is required}
      HOST: ${API_HOST:?API_HOST is required}
      PORT: ${API_PORT:?API_PORT is required}
      RUNTIME_DIR: ${API_RUNTIME_DIR:?API_RUNTIME_DIR is required}
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
    ports:
      - "${API_PORT:?API_PORT is required}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${DB_PORT:?DB_PORT is required}:5432"
    volumes:
      - quantagent-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quantagent-db:
